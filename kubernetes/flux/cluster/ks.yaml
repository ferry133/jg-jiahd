---
# Flux entry point for this per-user cluster.
# Defines the base-manifests GitRepository and all Kustomizations.
# Generated by task configure from cluster.yaml.

# ── cluster-secrets — SOPS-decrypted from per-user repo ──────────────────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  decryption:
    provider: sops
  interval: 1h
  path: ./kubernetes/components/sops
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# ── GitRepository — the shared base manifests ────────────────────────────────
#
#  `url` and `ref` come from base_repo_url / base_repo_ref / base_repo_ref_kind
#  so a cluster can follow its own fork, or pin a tag instead of tracking main.
#
#  ⚠️ The OBJECT NAME stays `jg-base` whatever the source is, and that is not
#  cosmetic. Nine Kustomizations reference it by name, and `cluster-apps-base`
#  is `prune: true` with an inventory covering cilium, cert-manager, coredns,
#  longhorn and flux-operator/flux-instance themselves. Renaming this object
#  makes Flux delete the old Kustomization, and pruning takes its inventory
#  with it — the cluster comes apart starting at the network layer. The name is
#  an internal handle, not a statement about who owns the repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jg-base
  namespace: flux-system
spec:
  interval: 1h
  # Both values QUOTED. `cue vet` guarantees these are strings in cluster.yaml,
  # but it guards the input and the retyping happens in the output: a plain YAML
  # scalar is retyped by whoever parses the rendered file, and the operators most
  # likely to set base_repo_ref are exactly the ones pinning a numeric tag.
  # Measured with yq on the rendered shape:
  #
  #     tag: 1.0        -> 1           !!float
  #     tag: 2.10       -> 2.1         !!float   <- the VALUE changed
  #     tag: 0755       -> 755         !!int
  #     tag: 20260828   -> 20260828    !!int
  #     tag: v1.0       -> "v1.0"      !!str     <- only this shape was safe
  #
  # `2.10` becoming `2.1` is the one that matters: not rejected, silently
  # reconciling a different tag. Third time this repo has been bitten by YAML
  # retyping a rendered value (jg-base#16's boolean, NODE_DNS_PATH), and the
  # first two both reached a cluster before anyone noticed.
  url: "https://github.com/ferry133/jg-base"
  ref:
    branch: "main"
---
# ── Base Kustomization — installed on every cluster ───────────────────────────
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-base
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: jg-base
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  wait: false
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
          deletionPolicy: WaitForTermination
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # enabled: longhorn_backup_target is set, so there is somewhere for the RecurringJob to write
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: longhorn-backup
          namespace: flux-system
        spec:
          suspend: false
          path: ./kubernetes/apps/base/storage/longhorn/backup/enabled
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: longhorn-backup
    # disabled (empty path, so anything previously applied is pruned): this profile declares its LAN addresses in cluster.yaml: an empty path so Flux prunes the probe and the pools it owns, rather than a suspend that would leave the pod recreating them
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: lan-address-probe
          namespace: flux-system
        spec:
          suspend: false
          path: ./kubernetes/apps/base/network/lan-address/disabled
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: lan-address-probe
    # enabled: the default im.<domain> web terminal from jg-base, gated on this cluster accepting the Auth0 OIDC front
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: claude-code-im
          namespace: flux-system
        spec:
          suspend: false
          path: ./kubernetes/apps/base/claudecode/claude-code/im/enabled
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: claude-code-im
    # disabled (empty path, so anything previously applied is pruned): no tenant holds grants.l2: an empty path so Flux prunes the Multus DaemonSet, rather than a suspend that would leave it on every node
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: multus
          namespace: flux-system
        spec:
          suspend: false
          path: ./kubernetes/apps/base/kube-system/multus/disabled
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: multus
    # disabled (empty path, so anything previously applied is pruned): no tenant holds grants.devices: an empty path so Flux prunes the device plugin, rather than a suspend that would leave it advertising
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: generic-device-plugin
          namespace: flux-system
        spec:
          suspend: false
          path: ./kubernetes/apps/base/kube-system/generic-device-plugin/disabled
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: generic-device-plugin
    # enabled: explicit-memory PostgreSQL from jg-base, one per default im, always on since 2026-09-06
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: claudecode-db
          namespace: flux-system
        spec:
          suspend: false
          path: ./kubernetes/apps/base/claudecode/postgres/app
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: claudecode-db
    # tenants: the gateway certificate also covers *.<tenant>.<domain>
    - patch: |-
        - op: add
          path: /spec/patches/-
          value:
            patch: |-
              - op: add
                path: /spec/dnsNames/-
                value: "*.im-apps.${SECRET_DOMAIN}"
            target:
              group: cert-manager.io
              kind: Certificate
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: envoy-gateway
---
# ── claude-code instances (base; per-cluster rendered from claude_instances) ──
# The shared pieces (namespace, SA/RBAC, OCIRepository, secrets) come from
# apps/base/claudecode in jg-base; only the per-instance HelmReleases are
# rendered here, because instance names and the optional oauth2-proxy /
# talos-mcp sidecars are template-time structure, not Flux values.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-code-instances
  namespace: flux-system
spec:
  decryption:
    provider: sops
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps/base/claudecode/claude-code/instances
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  dependsOn:
    - name: cluster-apps-base
---
# ── GitRepository — the optional apps (private; per-cluster deploy key) ──────
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jg-extras
  namespace: flux-system
spec:
  interval: 1h
  # Quoted for the reason the jg-base GitRepository gives.
  url: "ssh://git@github.com/ferry133/jg-extras.git"
  ref:
    branch: "main"
  # Rendered by components/sops/jg-extras-deploy-key.sops.yaml.j2 from this
  # directory's jg-extras.deploy.key; keys identity / known_hosts, the same
  # shape as the root sync's github-deploy-key.
  secretRef:
    name: jg-extras-deploy-key
---
