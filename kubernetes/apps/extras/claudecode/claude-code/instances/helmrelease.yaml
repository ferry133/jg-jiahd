---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cc
  namespace: claudecode
spec:
  chartRef:
    kind: OCIRepository
    name: claude-code
  interval: 1h
  values:
    controllers:
      cc:
        strategy: Recreate
        serviceAccount:
          name: claude-code # shared SA, RBAC bound in jg-base claudecode app
        containers:
          app:
            image:
              repository: ghcr.io/ferry133/claude-code
              tag: 86e7212
            env:
              # The pod runs as uid 0 (see defaultPodOptions), which would
              # resolve HOME=/root -- but all state (claude config PVC,
              # keyring, workspace) lives under /home/claude.
              HOME: /home/claude
              # Without this, onboarding/account state goes to ~/.claude.json
              # in the ephemeral overlay and login is lost on every pod
              # restart; inside CLAUDE_CONFIG_DIR it lands on the PVC.
              CLAUDE_CONFIG_DIR: /home/claude/.claude
              TTYD_CREDENTIAL:
                valueFrom:
                  secretKeyRef:
                    name: claude-code-secret
                    key: TTYD_CREDENTIAL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7681
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 7681
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    persistence:
      claude-config:
        type: persistentVolumeClaim
        storageClass: sc-nas
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /home/claude/.claude
          # gnome-keyring's store -- claude's OAuth tokens land here via
          # secret-service; without this mount they die with the pod.
          - path: /home/claude/.local/share/keyrings
            subPath: keyrings
      claude-workspace:
        type: persistentVolumeClaim
        storageClass: sc-nas
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /home/claude/workspace
      coding:
        type: nfs
        server: "${NAS_SERVER}"
        path: "${NAS_CODING_PATH}"
        globalMounts:
          - path: /home/claude/coding
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        # root, not uid 1000 (user-confirmed 2026-07-26): the NAS NFS exports
        # only allow root -- uid 1000 saw /home/claude/coding as d---------
        # (mode 000). Root's default runtime caps also cover NET_RAW, which
        # retires the setcap-file-capability + allowPrivilegeEscalation dance
        # the scanners needed under uid 1000. HOME is pinned to /home/claude
        # via container env.
        runAsUser: 0
        runAsGroup: 0
      labels:
        hostnetwork-group: claude-code
      # hostNetwork pods all bind :7681 on the node -- hard-require spreading
      # across nodes so this and any other claude-code/instance never collide
      # (including the base claude-code app and multiple claude_instances on
      # the same client).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  hostnetwork-group: claude-code
              topologyKey: kubernetes.io/hostname
    service:
      app:
        ports:
          http:
            port: 7681
    route:
      app:
        hostnames: ["cc.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 7681
